# One-second scrapes of per-process CPU, memory and threads from /proc (process-exporter).
global:
  scrape_interval: 1s
  scrape_timeout: 900ms
scrape_configs:
  - job_name: processes
    static_configs:
      - targets: ["127.0.0.1:9256"]
  - job_name: requests
    static_configs:
      - targets: ["127.0.0.1:9257"]
