[server]
http_addr = 127.0.0.1
http_port = 3000
[auth.anonymous]
enabled = true
org_role = Viewer
[auth]
disable_login_form = true
[users]
default_theme = dark
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[news]
news_feed_enabled = false
[paths]
provisioning = /home/dev/pybench/monitoring/grafana/provisioning
[dashboards]
# The live dashboard in the video refreshes every second (Grafana's default floor is 5 s).
min_refresh_interval = 1s
